apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingestion-api
  namespace: incident-response
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ingestion-api
  template:
    metadata:
      labels:
        app: ingestion-api
    spec:
      # No Kubernetes API access is needed; AWS credentials do not come from this token.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ingestion-api
          image: 767398054553.dkr.ecr.us-east-1.amazonaws.com/ingestion-api:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: incident-response-config
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # Initial estimates; adjust from observed usage. No CPU limit, to avoid throttling.
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          # Readiness checks DynamoDB, so an outage removes pods from the Service
          # without restarting them. Liveness checks only the process.
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
      volumes:
        # Writable scratch space, since the root filesystem is read-only.
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: ingestion-api-service
  namespace: incident-response
spec:
  selector:
    app: ingestion-api
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
  type: ClusterIP