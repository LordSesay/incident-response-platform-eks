apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingestion-api
  namespace: incident-response
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ingestion-api
  template:
    metadata:
      labels:
        app: ingestion-api
    spec:
      containers:
        - name: ingestion-api
          image: 767398054553.dkr.ecr.us-east-1.amazonaws.com/ingestion-api:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: incident-response-config
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: ingestion-api-service
  namespace: incident-response
spec:
  selector:
    app: ingestion-api
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
  type: ClusterIP