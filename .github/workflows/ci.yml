name: Application and container baseline
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements-test.txt
            application/*/requirements.txt
      - run: python -m pip install -r requirements-test.txt
      - name: Ingestion unit tests
        working-directory: application/ingestion-api
        run: python -m pytest tests -q
      - name: Incident unit tests
        working-directory: application/incident-api
        run: python -m pytest tests -q
      - name: DynamoDB integration test
        run: python -m pytest tests -q
  containers:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build --wait ingestion-api incident-api
      - run: docker compose --profile test run --rm smoke
      - name: Container logs
        if: failure()
        run: docker compose logs --no-color
      - name: Cleanup
        if: always()
        run: docker compose --profile test down --volumes --remove-orphans
